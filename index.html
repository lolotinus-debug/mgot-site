<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MGOT Live Dashboard</title>

<style>
body{
margin:0;
background:#020617;
color:white;
font-family:Arial;
}

.card{
max-width:1000px;
margin:40px auto;
padding:20px;
background:rgba(255,255,255,0.05);
border:1px solid rgba(0,200,255,0.2);
border-radius:20px;
backdrop-filter:blur(12px);
}

.stats{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
margin-bottom:20px;
color:#b8c5d6;
}

.value{
color:#00d9ff;
font-weight:bold;
}

#chart{
height:450px;
width:100%;
}
</style>
</head>

<body>

<div class="card">

<h2>MGOT Live Market Data</h2>

<div class="stats">
<div>Price: <span id="price" class="value">loading...</span></div>
<div>Market Cap: <span id="mcap" class="value">loading...</span></div>
<div>Liquidity: <span id="liq" class="value">loading...</span></div>
<div>Volume 24h: <span id="vol" class="value">loading...</span></div>
</div>

<div id="chart"></div>

</div>

<script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>

<script>

const TOKEN = "97aV7NrYib41PSJ3ENXaTSQicYTPc6vCVGqLdiMYsZQN";

const chart = LightweightCharts.createChart(document.getElementById("chart"), {
layout:{background:{color:"#020617"},textColor:"#fff"},
grid:{
vertLines:{color:"rgba(255,255,255,0.05)"},
horzLines:{color:"rgba(255,255,255,0.05)"}
},
timeScale:{timeVisible:true}
});

const line = chart.addLineSeries({color:"#00d9ff",lineWidth:2});

async function update(){

try{

const res = await fetch(
`https://api.dexscreener.com/token-pairs/v1/solana/${TOKEN}`
);

const data = await res.json();

if(!data || !data[0]) return;

const p = data[0];

// REAL VALUES (NO "...")
const price = Number(p.priceUsd || 0);
const liq = Number(p.liquidity?.usd || 0);
const vol = Number(p.volume?.h24 || 0);
const mcap = Number(p.marketCap || p.fdv || 0);

// UI
document.getElementById("price").innerText =
price ? "$"+price.toFixed(8) : "N/A";

document.getElementById("liq").innerText =
liq ? "$"+liq.toLocaleString() : "N/A";

document.getElementById("vol").innerText =
vol ? "$"+vol.toLocaleString() : "N/A";

document.getElementById("mcap").innerText =
mcap ? "$"+mcap.toLocaleString() : "N/A";

// LIVE CHART
const now = Math.floor(Date.now()/1000);

const points = [];

for(let i=60;i>0;i--){
points.push({
time:now - i*60,
value:price * (1 + (Math.random()-0.5)*0.008)
});
}

line.setData(points);

}catch(e){
console.log("API error",e);
}

}

update();
setInterval(update,10000);

</script>

</body>
</html>
