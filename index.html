<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MGOT – Pro Dashboard</title>

<style>
:root{
--bg:#020617;
--card:rgba(255,255,255,0.05);
--text:#ffffff;
--muted:#94a3b8;
}

*{box-sizing:border-box;}

body{
margin:0;
font-family:Arial;
background:var(--bg);
color:var(--text);
}

.container{
max-width:1100px;
margin:auto;
padding:20px;
}

/* HEADER */
.header{
display:flex;
justify-content:space-between;
align-items:center;
padding:18px 0;
}

.logo-wrap{
display:flex;
align-items:center;
gap:12px;
}

.logo-img{
width:44px;
height:44px;
object-fit:contain;
filter:drop-shadow(0 0 10px #00d9ff);
}

.title{
font-size:22px;
font-weight:bold;
background:linear-gradient(90deg,#00d9ff,#0066ff);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

/* HERO */
.hero{
display:flex;
align-items:center;
gap:15px;
margin:25px 0;
color:#94a3b8;
}

.hero img{
width:80px;
height:80px;
object-fit:contain;
filter:drop-shadow(0 0 15px #00d9ff);
}

/* BUTTON */
.btn{
padding:10px 16px;
border-radius:12px;
background:linear-gradient(90deg,#00c3ff,#005eff);
color:white;
text-decoration:none;
font-weight:bold;
}

/* GRID */
.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:15px;
margin-top:20px;
}

.card{
background:var(--card);
border:1px solid rgba(0,180,255,0.2);
padding:18px;
border-radius:18px;
backdrop-filter:blur(10px);
}

.label{
color:var(--muted);
font-size:13px;
}

.value{
font-size:18px;
margin-top:6px;
color:#00d9ff;
font-weight:bold;
}

.section-title{
margin-top:40px;
font-size:20px;
color:#00d9ff;
}

/* CHART */
iframe{
width:100%;
height:520px;
border:0;
border-radius:18px;
margin-top:15px;
}
</style>
</head>

<body>

<div class="container">

<!-- HEADER -->
<div class="header">

<div class="logo-wrap">

<img src="logo.png" class="logo-img" onerror="this.style.display='none'">

<div class="title">MGOT</div>

</div>

<a class="btn" href="https://jup.ag/tokens/97aV7NrYib41PSJ3ENXaTSQicYTPc6vCVGqLdiMYsZQN" target="_blank">
Buy
</a>

</div>

<!-- HERO -->
<div class="hero">
<img src="logo.png" onerror="this.style.display='none'">
<div>
MGOT is a Community Token for growing together.<br>
Mindset • Growth • Optimization • Web3 Expansion
</div>
</div>

<!-- LIVE DATA -->
<div class="section-title">Live Market Data</div>

<div class="grid">

<div class="card">
<div class="label">Price</div>
<div class="value" id="price">loading...</div>
</div>

<div class="card">
<div class="label">Market Cap</div>
<div class="value" id="mcap">loading...</div>
</div>

<div class="card">
<div class="label">Liquidity</div>
<div class="value" id="liq">loading...</div>
</div>

<div class="card">
<div class="label">Volume 24h</div>
<div class="value" id="vol">loading...</div>
</div>

</div>

<!-- CHART -->
<div class="section-title">Live Chart</div>

<iframe
src="https://dexscreener.com/solana/5dnhapu3ynmqvsbrngxy2qtpgvsziemvdcegdg5shrj9?embed=1">
</iframe>

<!-- CONTRACT -->
<div class="section-title">Contract</div>

<div class="card">
97aV7NrYib41PSJ3ENXaTSQicYTPc6vCVGqLdiMYsZQN
</div>

</div>

<script>

const TOKEN="97aV7NrYib41PSJ3ENXaTSQicYTPc6vCVGqLdiMYsZQN";

function fmt(v){
return v ? "$"+Number(v).toLocaleString() : "N/A";
}

async function load(){

try{

const r = await fetch(`https://api.dexscreener.com/token-pairs/v1/solana/${TOKEN}`);
const d = await r.json();

if(!d || !d[0]) return;

const p = d[0];

document.getElementById("price").innerText =
p.priceUsd ? "$"+Number(p.priceUsd).toFixed(8) : "N/A";

document.getElementById("mcap").innerText = fmt(p.marketCap || p.fdv);
document.getElementById("liq").innerText = fmt(p.liquidity?.usd);
document.getElementById("vol").innerText = fmt(p.volume?.h24);

}catch(e){
console.log(e);
}

}

load();
setInterval(load,10000);

</script>

</body>
</html>
