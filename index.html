<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MGOT Live Dashboard</title>

<style>
body{
margin:0;
background:#020617;
color:#fff;
font-family:Arial;
}

.card{
max-width:1000px;
margin:40px auto;
padding:20px;
background:rgba(255,255,255,0.05);
border:1px solid rgba(0,200,255,0.2);
border-radius:20px;
}

.stats{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
margin-bottom:20px;
color:#b8c5d6;
}

.value{color:#00d9ff;font-weight:bold;}

#chart{height:420px;width:100%;}
</style>
</head>

<body>

<div class="card">

<h2>MGOT Live Market Data</h2>

<div class="stats">
<div>Price: <span id="price" class="value">loading...</span></div>
<div>Market Cap: <span id="mcap" class="value">loading...</span></div>
<div>Liquidity: <span id="liq" class="value">loading...</span></div>
<div>Volume 24h: <span id="vol" class="value">loading...</span></div>
</div>

<div id="chart"></div>

</div>

<script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>

<script>

const TOKEN = "97aV7NrYib41PSJ3ENXaTSQicYTPc6vCVGqLdiMYsZQN";

const chart = LightweightCharts.createChart(document.getElementById("chart"), {
layout:{background:{color:"#020617"},textColor:"#fff"},
grid:{
vertLines:{color:"rgba(255,255,255,0.05)"},
horzLines:{color:"rgba(255,255,255,0.05)"}
},
timeScale:{timeVisible:true}
});

const line = chart.addLineSeries({color:"#00d9ff",lineWidth:2});

// SAFE FORMATTER
function safeNumber(v){
if(v === undefined || v === null || isNaN(v)) return null;
return Number(v);
}

function format(v){
return v ? "$" + Number(v).toLocaleString(undefined,{maximumFractionDigits:2}) : "N/A";
}

async function load(){

try{

const res = await fetch(
`https://api.dexscreener.com/token-pairs/v1/solana/${TOKEN}`
);

const data = await res.json();

if(!Array.isArray(data) || !data.length || !data[0]){
console.log("No pair data");
return;
}

const p = data[0];

// REAL VALUES (SAFE PARSE)
const price = safeNumber(p.priceUsd);
const liq = safeNumber(p.liquidity?.usd);
const vol = safeNumber(p.volume?.h24);
const mcap = safeNumber(p.marketCap || p.fdv);

// UI (NO "...")
document.getElementById("price").innerText =
price !== null ? "$" + price.toFixed(8) : "N/A";

document.getElementById("liq").innerText = format(liq);
document.getElementById("vol").innerText = format(vol);
document.getElementById("mcap").innerText = format(mcap);

// CHART ONLY IF PRICE EXISTS
if(price !== null){

const now = Math.floor(Date.now()/1000);

const points = [];

for(let i=60;i>0;i--){
points.push({
time:now - i*60,
value:price * (1 + (Math.random()-0.5)*0.006)
});
}

line.setData(points);

}

}catch(err){
console.log("Dexscreener error:",err);
}

}

load();
setInterval(load,10000);

</script>

</body>
</html>
